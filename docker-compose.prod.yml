services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_pejam}
      POSTGRES_USER: ${POSTGRES_USER:-parking}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-parking_pejam}
      POSTGRES_USER: ${POSTGRES_USER:-parking}
      Licensing__RequireLicense: "true"
      Licensing__LicensePath: /app/license/license.json
      Licensing__InstallationId: ${PARKING_LICENSE_INSTALLATION_ID:?set PARKING_LICENSE_INSTALLATION_ID}
      Storage__DataPath: /app/Data
    secrets:
      - postgres_password
      - bootstrap_admin_password
      - sensor_ingress_key
    volumes:
      - app_data:/app/Data
      - ./deploy/license:/app/license:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      PARKING_DOMAIN: ${PARKING_DOMAIN:?set PARKING_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

secrets:
  postgres_password:
    file: ./deploy/secrets/postgres_password.txt
  bootstrap_admin_password:
    file: ./deploy/secrets/bootstrap_admin_password.txt
  sensor_ingress_key:
    file: ./deploy/secrets/sensor_ingress_key.txt

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
