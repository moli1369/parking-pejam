services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_pejam}
      POSTGRES_USER: ${POSTGRES_USER:-parking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: src/ParkingPejam.Web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: postgres
      ConnectionStrings__Parking: Host=db;Port=5432;Database=${POSTGRES_DB:-parking_pejam};Username=${POSTGRES_USER:-parking};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      Parking__BootstrapAdminPassword: ${PARKING_BOOTSTRAP_ADMIN_PASSWORD:?set PARKING_BOOTSTRAP_ADMIN_PASSWORD}
      Parking__SensorIngressKey: ${PARKING_SENSOR_INGRESS_KEY:?set PARKING_SENSOR_INGRESS_KEY}
    volumes:
      - app_data:/app/Data

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
  app_data:
