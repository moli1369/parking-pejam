services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking_pejam}
      POSTGRES_USER: ${POSTGRES_USER:-parking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: postgres
      ConnectionStrings__Parking: Host=db;Port=5432;Database=${POSTGRES_DB:-parking_pejam};Username=${POSTGRES_USER:-parking};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      Parking__BootstrapAdminPassword: ${PARKING_BOOTSTRAP_ADMIN_PASSWORD:?set PARKING_BOOTSTRAP_ADMIN_PASSWORD}
      Parking__SensorIngressKey: ${PARKING_SENSOR_INGRESS_KEY:?set PARKING_SENSOR_INGRESS_KEY}
      Licensing__RequireLicense: "true"
      Licensing__LicensePath: /app/license/license.json
      Licensing__InstallationId: ${PARKING_LICENSE_INSTALLATION_ID:?set PARKING_LICENSE_INSTALLATION_ID}
      Storage__DataPath: /app/Data
    volumes:
      - app_data:/app/Data
      - ./deploy/license:/app/license:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 2.0
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      PARKING_DOMAIN: ${PARKING_DOMAIN:?set PARKING_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
