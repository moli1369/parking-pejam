services:
  parking-pejam:
    build: .
    ports:
      - "8080:8080"
    environment:
      Parking__AdminKey: "${PARKING_ADMIN_KEY:?Set PARKING_ADMIN_KEY before starting}"
      ConnectionStrings__Parking: "Data Source=/data/parking.db"
    volumes:
      - parking-data:/data
    restart: unless-stopped

volumes:
  parking-data:
