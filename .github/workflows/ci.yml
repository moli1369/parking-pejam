name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore web platform
        run: dotnet restore src/ParkingPejam.Web/ParkingPejam.Web.csproj

      - name: Build web platform
        run: dotnet build src/ParkingPejam.Web/ParkingPejam.Web.csproj --configuration Release --no-restore

      - name: Restore tests
        run: dotnet restore tests/ParkingPejam.Tests/ParkingPejam.Tests.csproj

      - name: Run tests
        run: dotnet test tests/ParkingPejam.Tests/ParkingPejam.Tests.csproj --configuration Release --no-restore

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production container
        run: docker build --tag parking-pejam:ci .
