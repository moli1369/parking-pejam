name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore web platform
        run: dotnet restore src/ParkingPejam.Web/ParkingPejam.Web.csproj

      - name: Build web platform
        run: dotnet build src/ParkingPejam.Web/ParkingPejam.Web.csproj --configuration Release --no-restore

      - name: Restore tests
        run: dotnet restore tests/ParkingPejam.Tests/ParkingPejam.Tests.csproj

      - name: Run tests
        run: dotnet test tests/ParkingPejam.Tests/ParkingPejam.Tests.csproj --configuration Release --no-restore

  docker-security:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production container
        run: docker build --tag parking-pejam:ci .

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.72.0 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed parking-pejam:ci

      - name: Generate SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" \
            aquasec/trivy:0.72.0 \
            image --format cyclonedx --output /work/parking-pejam-sbom.json parking-pejam:ci

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: parking-pejam-sbom
          path: parking-pejam-sbom.json
