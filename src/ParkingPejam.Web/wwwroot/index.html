<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <meta name="description" content="Parking Pejam live parking monitoring dashboard">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <title>Parking Pejam · Operations</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PEJAM · PARKING OPERATIONS</div>
        <h1>Parking Control Center</h1>
      </div>
      <div class="top-actions">
        <span id="connection" class="status-pill offline">Connecting…</span>
        <button id="refreshBtn" class="ghost">Refresh</button>
      </div>
    </header>

    <main>
      <section class="metrics" id="metrics"></section>

      <section class="grid-layout">
        <div class="panel map-panel">
          <div class="panel-head">
            <div>
              <span class="eyebrow">LIVE MAP</span>
              <h2>Parking layout</h2>
            </div>
            <div class="legend">
              <span><i class="dot free"></i>Free</span>
              <span><i class="dot occupied"></i>Occupied</span>
              <span><i class="dot reserved"></i>Reserved</span>
              <span><i class="dot out"></i>Out</span>
            </div>
          </div>
          <div id="zones"></div>
        </div>

        <aside class="panel events-panel">
          <div class="panel-head">
            <div><span class="eyebrow">AUDIT TRAIL</span><h2>Recent activity</h2></div>
          </div>
          <div id="events" class="events"></div>
        </aside>
      </section>
    </main>
  </div>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-card" id="settingsForm">
      <span class="eyebrow">OPERATOR ACCESS</span>
      <h2>Admin key</h2>
      <p>Used only for protected status changes. Stored in this browser session.</p>
      <input id="adminKey" type="password" placeholder="Parking:AdminKey" autocomplete="off">
      <input id="actor" type="text" placeholder="Operator name" value="Web Operator">
      <div class="dialog-actions"><button value="cancel" class="ghost">Cancel</button><button id="saveSettings" value="default">Save</button></div>
    </form>
  </dialog>

  <button id="settingsBtn" class="floating">⚙</button>
  <script src="/app.js"></script>
</body>
</html>
